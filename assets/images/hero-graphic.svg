<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-label="رسم توضيحي لخدمات نقل الأثاث والتغليف الاحترافي بالرياض">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect x="20" y="20" width="760" height="560" rx="24" fill="url(#skyGrad)"/>
  
  <!-- Riyadh Landmarks Subtle Vector Silhouette in Background -->
  <path d="M120 450 L120 380 L140 370 L160 380 L160 450 Z" fill="#CBD5E1" opacity="0.4"/>
  <path d="M220 450 L220 310 L250 250 L280 310 L280 450 Z" fill="#CBD5E1" opacity="0.4"/> <!-- Stylized Tower -->
  <path d="M246 220 L254 220 L252 250 L248 250 Z" fill="#94A3B8" opacity="0.5"/>
  <path d="M560 450 L560 330 L610 330 L610 450 Z" fill="#CBD5E1" opacity="0.35"/>
  <path d="M640 450 L640 360 L680 360 L680 450 Z" fill="#CBD5E1" opacity="0.35"/>

  <!-- Ground Plane -->
  <line x1="60" y1="460" x2="740" y2="460" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- Moving Dina / Truck Vector -->
  <g id="truck" transform="translate(140, 260)">
    <!-- Main Cargo Container -->
    <rect x="40" y="20" width="280" height="150" rx="8" fill="#102A43"/>
    <!-- Cargo Details / Stripes -->
    <rect x="40" y="140" width="280" height="14" fill="#0F766E"/>
    <rect x="40" y="80" width="280" height="2" fill="#243B53"/>
    
    <!-- Osool Typography on Truck Cargo -->
    <text x="180" y="70" text-anchor="middle" font-family="'Tajawal', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">أُصُـــول</text>
    <text x="180" y="96" text-anchor="middle" font-family="'Tajawal', sans-serif" font-size="12" font-weight="600" fill="#99F6E4">نقل عفش متخصص • الرياض</text>
    
    <!-- Truck Cabin -->
    <path d="M320 60 L380 60 L410 110 L410 170 L320 170 Z" fill="#0F766E"/>
    <!-- Cabin Window -->
    <path d="M330 70 L375 70 L395 105 L330 105 Z" fill="#CCFBF1" opacity="0.85"/>
    <!-- Front Bumper & Headlight -->
    <rect x="395" y="145" width="20" height="20" rx="4" fill="#E2E8F0"/>
    <rect x="410" y="140" width="6" height="12" rx="2" fill="#F97316"/>
    <!-- Truck Wheels -->
    <g transform="translate(100, 170)">
      <circle cx="0" cy="0" r="32" fill="#1E293B"/>
      <circle cx="0" cy="0" r="18" fill="#64748B"/>
      <circle cx="0" cy="0" r="6" fill="#F8FAFC"/>
    </g>
    <g transform="translate(250, 170)">
      <circle cx="0" cy="0" r="32" fill="#1E293B"/>
      <circle cx="0" cy="0" r="18" fill="#64748B"/>
      <circle cx="0" cy="0" r="6" fill="#F8FAFC"/>
    </g>
    <g transform="translate(370, 170)">
      <circle cx="0" cy="0" r="32" fill="#1E293B"/>
      <circle cx="0" cy="0" r="18" fill="#64748B"/>
      <circle cx="0" cy="0" r="6" fill="#F8FAFC"/>
    </g>
  </g>

  <!-- Moving Boxes Stacked with Care Labels -->
  <g transform="translate(80, 360)">
    <rect x="0" y="30" width="70" height="70" rx="4" fill="#D97706" opacity="0.9"/>
    <rect x="10" y="55" width="50" height="8" fill="#B45309"/>
    <path d="M0 30 L35 48 L70 30" stroke="#78350F" stroke-width="2"/>
    <!-- Fragile Icon -->
    <path d="M32 70 L38 70 M35 70 L35 78 M31 78 L39 78" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Feature Badges -->
  <!-- Badge 1: Packaging & Protection -->
  <g transform="translate(480, 80)" filter="url(#cardShadow)">
    <rect width="240" height="74" rx="16" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="180" y="15" width="44" height="44" rx="10" fill="#CCFBF1"/>
    <!-- Shield / Protection SVG -->
    <path d="M202 24 L212 28 V36 C212 43 202 47 202 47 C202 47 192 43 192 36 V28 Z" fill="#0F766E"/>
    <text x="165" y="36" text-anchor="end" font-family="'Tajawal', sans-serif" font-size="15" font-weight="700" fill="#102A43">تغليف محكم وعناية</text>
    <text x="165" y="52" text-anchor="end" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B">حماية كاملة للأثاث الحساس</text>
  </g>

  <!-- Badge 2: Fast Organization -->
  <g transform="translate(60, 110)" filter="url(#cardShadow)">
    <rect width="230" height="74" rx="16" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="170" y="15" width="44" height="44" rx="10" fill="#FFEDD5"/>
    <!-- Clock / Organization SVG -->
    <circle cx="192" cy="37" r="12" stroke="#F97316" stroke-width="2.5" fill="none"/>
    <polyline points="192 31 192 37 197 39" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
    <text x="155" y="36" text-anchor="end" font-family="'Tajawal', sans-serif" font-size="15" font-weight="700" fill="#102A43">تنظيم دقيق للمواعيد</text>
    <text x="155" y="52" text-anchor="end" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B">تنسيق مرحلي لكل خطوة</text>
  </g>

  <!-- Badge 3: Dismantling & Assembly -->
  <g transform="translate(500, 390)" filter="url(#cardShadow)">
    <rect width="230" height="74" rx="16" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="170" y="15" width="44" height="44" rx="10" fill="#E0F2FE"/>
    <!-- Wrench / Tools -->
    <path d="M190 40 L198 32 C201 35 201 37 199 39 L194 44 Z" fill="#0284C7"/>
    <circle cx="187" cy="43" r="4" fill="#0284C7"/>
    <text x="155" y="36" text-anchor="end" font-family="'Tajawal', sans-serif" font-size="15" font-weight="700" fill="#102A43">فك وتركيب متخصص</text>
    <text x="155" y="52" text-anchor="end" font-family="'Tajawal', sans-serif" font-size="12" font-weight="500" fill="#64748B">غرف النوم والمطابخ والمكاتب</text>
  </g>
</svg>
